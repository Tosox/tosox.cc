server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # No access logs: the privacy policy promises no visitor logs
    access_log off;
    log_not_found off;

    # TLS terminates at Cloudflare; no header means direct/local access
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    include /etc/nginx/snippets/security-headers.conf;

    location ^~ /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    # Content-hashed build output
    location ~* "-[A-Z0-9]{8}\.(js|css|woff2)$" {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Exact match so it also applies after the internal redirects from / and try_files
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Missing files get a real 404, not the SPA shell
    location ~ "\.[a-zA-Z0-9]+$" {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
