server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version.
    server_tokens off;

    # Privacy: don't record visitors. Access logs would store every visitor's IP address, and
    # nothing here needs them (Cloudflare's dashboard already shows traffic statistics).
    # Error logs stay on for debugging; missing files are routine 404s, not errors.
    access_log off;
    log_not_found off;

    # TLS terminates at Cloudflare, which tells us the visitor's scheme via X-Forwarded-Proto.
    # Bounce plain-HTTP visitors to HTTPS (no header = direct/local access, left alone).
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    include /etc/nginx/snippets/security-headers.conf;

    # Proxy API calls to the backend container (same-origin in production -> no CORS needed).
    location ^~ /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://api:8080;
        # Visitor IPs are deliberately not forwarded: the API never needs to know who is asking.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Long-cache the content-hashed build output (main-ABCD1234.js, styles-ABCD1234.css,
    # media/space-grotesk-latin-wght-normal-ABCD1234.woff2, ...).
    location ~* "-[A-Z0-9]{8}\.(js|css|woff2)$" {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The SPA shell must never be cached, so new deployments (new hashed bundles) are picked up
    # immediately. Exact match so it also applies after the internal redirects from / and try_files.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Anything that looks like a file (robots.txt, favicon.ico, .well-known/...) must exist;
    # otherwise return a real 404 instead of the SPA shell.
    location ~ "\.[a-zA-Z0-9]+$" {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # SPA fallback: serve index.html for client-side routes (/about, /work, ...).
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
