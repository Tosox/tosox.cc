spring:
  application:
    name: api

server:
  port: 8080

github:
  username: Tosox
  organizations:
    - rpc4games
    - CoHModSDK
    - CodeSparkApp
  # Optional; raises the rate limit from 60 to 5000 req/hr
  token: ${GITHUB_TOKEN:}
  excluded-users:
    - Tosox
    - CoHModSDK
    - rpc4games
  refresh-interval-ms: 1800000   # 30 minutes
  search-limit: 40

management:
  endpoints:
    web:
      exposure:
        include: health
